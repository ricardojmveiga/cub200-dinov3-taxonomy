name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]   # Linux, Windows, Apple-ARM
        python: ['3.9', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU-only, cross-platform)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Tests (helpers + random->ARI~0 sanity + the paper's numbers from the bundled data)
        run: python -m pytest tests/ -v
      - name: Reproduce Figure 1, Figure 2, Table 1
        run: python 04_make_figures.py
